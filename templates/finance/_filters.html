<form class="filters panel" method="get">{% for field in filter_form %}<div class="filter-field"><label for="{{ field.id_for_label }}">{{ field.label }}</label>{{ field }}{{ field.errors }}</div>{% endfor %}<div class="filter-actions"><button class="button primary">Применить</button><a href="{{ request.path }}" class="text-link">Сбросить</a></div>{% if filter_form.non_field_errors %}<div class="field-errors">{{ filter_form.non_field_errors }}</div>{% endif %}</form>
