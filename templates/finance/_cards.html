{% load finance_tags %}<div class="account-grid">{% for account in accounts %}<a class="account-card {{ account.color }}" href="{% url 'account_edit' account.pk %}"><div class="card-top"><span>{{ account.bank }}</span>{% icon 'card' %}</div><div class="card-name">{{ account.name }}</div><div class="card-balance">{{ account.balance|rub }}</div><div class="card-foot"><span>{% if account.last_four %}•••• &nbsp; {{ account.last_four }}{% else %}Личный счёт{% endif %}</span><span>RUB</span></div></a>{% endfor %}</div>
