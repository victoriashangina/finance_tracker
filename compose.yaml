services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: potok
      POSTGRES_USER: potok
      POSTGRES_PASSWORD: local-demo-only
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U potok"]
      interval: 3s
      timeout: 3s
      retries: 15
  web:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DEBUG: "True"
      DATABASE_URL: postgresql://potok:local-demo-only@db:5432/potok
      ALLOWED_HOSTS: localhost,127.0.0.1
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres_data:
